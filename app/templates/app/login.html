<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>

    <h1>ログイン</h1>

    {% if form.non_field_errors %}
        <p style="color: red;">{{ form.non_field_errors.0 }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">ログイン</button>
    </form>

    <a href="{% url 'app:index' %}">トップに戻る</a>

    
    <p><a href="{% url 'app:signup' %}">新規登録はこちら</a></p>

</body>
</html>
