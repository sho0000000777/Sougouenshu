{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員情報変更</title>
    <link rel="stylesheet" href="{% static 'app/style.css' %}">
</head>
<body>

<h2>会員情報変更</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    {% if form.non_field_errors %}
        {% for error in form.non_field_errors %}
            <p class="error">{{ error }}</p>
        {% endfor %}
    {% endif %}

    <button type="submit">確認へ</button>
</form>
<p><a href="{% url 'app:user_delete' %}">退会する</a></p>

<p><a href="{% url 'app:userinfo' %}">会員情報確認へ戻る</a></p>
<p><a href="{% url 'app:index' %}">トップへ戻る</a></p>

</body>
</html>
